# Cloudflare Bypass — Archivist's challenge-solving browser service.
#
# Upstream: https://github.com/germondai/trawl (AGPL-3.0). The upstream project
# is named Trawl and its image keeps that name; inside Archivist the capability
# is called Cloudflare Bypass. It runs as its own service and Archivist speaks
# to it over HTTP, so it stays at arm's length: no upstream source is compiled
# into this repository.
#
# Managed by `archivist-cloudflare-bypass.service`, which Control starts and
# stops through polkit. Install this file to
# /etc/archivist/cloudflare-bypass/docker-compose.yml and put overrides in
# /etc/archivist/cloudflare-bypass.env.
#
# PROXY_URL is the egress hook (network-egress-control-spec §4.2): pointing it
# at archivist-vpn-proxy sends every challenge solve through the tunnel while
# metadata and torrent traffic stay on the direct link.

services:
  redis:
    image: redis:8.8.1-alpine
    restart: always
    volumes:
      - redis_data:/data

  cloudflare-bypass:
    image: ghcr.io/germondai/trawl:${CLOUDFLARE_BYPASS_IMAGE_TAG:-latest}
    restart: always
    ports:
      # Bound to one interface rather than published on every address: only
      # Archivist needs to reach the solver.
      - "${CLOUDFLARE_BYPASS_BIND:-127.0.0.1}:${PORT:-8191}:8191"
    shm_size: 1gb
    mem_limit: ${CLOUDFLARE_BYPASS_MEM_LIMIT:-3g}
    environment:
      REDIS_URL: redis://redis:6379
      # Default 3 is what exhausted the pool on the previous host: a probe
      # sweep plus live searches outruns it, and every waiter then fails.
      BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE:-6}
      BROWSER_ACQUIRE_TIMEOUT_MS: ${BROWSER_ACQUIRE_TIMEOUT_MS:-15000}
      PROXY_URL: ${PROXY_URL:-}
      RESIDENTIAL_PROXY_URL: ${RESIDENTIAL_PROXY_URL:-}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
      # The forward proxy is a separate concern from egress and stays off.
      MITM_PROXY_ENABLED: ${MITM_PROXY_ENABLED:-false}
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8191/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  redis_data:
