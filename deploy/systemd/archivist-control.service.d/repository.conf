# Run Control from the working repository instead of an immutable release.
#
#   sudo install -d /etc/systemd/system/archivist-control.service.d
#   sudo install -m 0644 repository.conf \
#     /etc/systemd/system/archivist-control.service.d/repository.conf
#   sudo systemctl daemon-reload && sudo systemctl restart archivist-control
#
# Mirrors the drop-in archivist.service already uses, so Control tracks the
# repository the same way the runtime does.
#
# Deliberately NOT applied to archivist-control-agent.service. That unit runs
# as root; sourcing its code from a repository any unprivileged user can write
# would turn "write a file" into "execute as root". The agent stays on the
# immutable /opt/archivist release, and nothing here requires changing it.
#
# The bind mount is read-only and lives in this unit's private mount namespace,
# so /run/archivist-repository is not visible to other services.

[Service]
BindReadOnlyPaths=/home/taylorn84/Downloads/projects/archivist-labs:/run/archivist-repository
WorkingDirectory=/run/archivist-repository
ExecStart=
ExecStart=/usr/bin/node /run/archivist-repository/apps/control/dist/server/index.js
