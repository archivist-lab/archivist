services:
  archivist:
    build:
      context: .
      dockerfile: Dockerfile
    image: archivist:1
    container_name: archivist
    # The supervisor runs isolated API and background-worker processes. The API
    # process serves every surface on ONE port, routed by path prefix:
    #   /library    Library UI    /player      Player UI
    #   /catalogue  Catalogue UI  /api/v1      API (shared by all three)
    ports:
      - "2424:2424"
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Dubai}
      # Reverse proxy: rate limiting keys on the client IP and the session
      # cookie's Secure flag follows X-Forwarded-Proto, so set TRUST_PROXY in
      # .env when a proxy sits in front (a hop count like 1, a subnet, or
      # 'true'). Left empty the headers are ignored — trusting them with no
      # proxy in front would let a client spoof its own rate-limit key.
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Where Settings → Cloudflare Bypass → "Internal" points. MUST be the
      # service name: inside this container 127.0.0.1 is Archivist itself, so
      # the bare-metal default would probe the wrong process.
      ARCHIVIST_CLOUDFLARE_BYPASS_URL: ${ARCHIVIST_CLOUDFLARE_BYPASS_URL:-http://cloudflare-bypass:8191}
      ARCHIVIST_LOUDNESS_CONCURRENCY: ${ARCHIVIST_LOUDNESS_CONCURRENCY:-2}
      ARCHIVIST_TRANSCODE_CONCURRENCY: ${ARCHIVIST_TRANSCODE_CONCURRENCY:-2}
      PLAYER_UI_V2_ENABLED: ${PLAYER_UI_V2_ENABLED:-true}
      PLAYER_UI_DEFAULT_PRESET: ${PLAYER_UI_DEFAULT_PRESET:-categories}
      PLAYER_UI_MAX_WIDGET_ITEMS: ${PLAYER_UI_MAX_WIDGET_ITEMS:-36}
      PLAYER_UI_TELEMETRY_ENABLED: ${PLAYER_UI_TELEMETRY_ENABLED:-false}
      ARCHIVIST_CATALOGUE_DB: ${ARCHIVIST_CATALOGUE_DB:-/app/data/catalogue/catalogue.sqlite}
      ARCHIVIST_CATALOGUE_DIR: ${ARCHIVIST_CATALOGUE_DIR:-/app/apps/catalogue/dist}
      ARCHIVIST_CATALOGUE_ARTWORK: ${ARCHIVIST_CATALOGUE_ARTWORK:-/app/data/catalogue/artwork}
      ARCHIVIST_CATALOGUE_IMDB_CACHE: ${ARCHIVIST_CATALOGUE_IMDB_CACHE:-/app/data/catalogue/imdb}
      ARCHIVIST_CATALOGUE_SYNC_HOUR_UTC: ${ARCHIVIST_CATALOGUE_SYNC_HOUR_UTC:-9}
      ARCHIVIST_CATALOGUE_SYNC_MINUTE_UTC: ${ARCHIVIST_CATALOGUE_SYNC_MINUTE_UTC:-15}
      # Transmission-style download flow: torrents land in …/incomplete while
      # downloading and are moved to …/complete on finish, then imported into media.
      TORRENT_INCOMPLETE_DIR: ${TORRENT_INCOMPLETE_DIR:-/app/downloads/incomplete}
      TORRENT_DOWNLOAD_DIR: ${TORRENT_DOWNLOAD_DIR:-/app/downloads/complete}
    volumes:
      - ./data:/app/data
      - ./media:/app/media
      - ./downloads:/app/downloads
    # Hardware video transcoding (Intel QSV/VAAPI, AMD VAAPI): pass the GPU render
    # node AND point the optimiser at a HW-enabled ffmpeg (the bundled ffmpeg is
    # software-only). Uncomment and set ARCHIVIST_FFMPEG_PATH to a system ffmpeg
    # built with VAAPI/QSV (e.g. install `ffmpeg` + `intel-media-va-driver` in a
    # custom image). NVIDIA instead needs the nvidia container runtime.
    # devices:
    #   - /dev/dri:/dev/dri
    # environment:
    #   ARCHIVIST_FFMPEG_PATH: /usr/bin/ffmpeg
    depends_on:
      cloudflare-bypass:
        condition: service_started
    restart: unless-stopped

  # Solves the bot challenges in front of several indexers. Upstream is
  # https://github.com/germondai/trawl (AGPL-3.0), reached over HTTP so no
  # upstream source is compiled into Archivist.
  # Enable in Settings → Cloudflare Bypass → Internal.
  cloudflare-bypass:
    image: ghcr.io/germondai/trawl:${CLOUDFLARE_BYPASS_IMAGE_TAG:-latest}
    container_name: archivist-cloudflare-bypass
    # Deliberately not published: Archivist reaches it over the Compose
    # network, and a published port would expose a general-purpose fetcher.
    expose:
      - "8191"
    shm_size: 1gb
    mem_limit: ${CLOUDFLARE_BYPASS_MEM_LIMIT:-3g}
    environment:
      REDIS_URL: redis://cloudflare-bypass-redis:6379
      BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE:-6}
      BROWSER_ACQUIRE_TIMEOUT_MS: ${BROWSER_ACQUIRE_TIMEOUT_MS:-15000}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
      PROXY_URL: ${PROXY_URL:-}
      MITM_PROXY_ENABLED: "false"
    depends_on:
      - cloudflare-bypass-redis
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8191/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  cloudflare-bypass-redis:
    image: redis:8.8.1-alpine
    container_name: archivist-cloudflare-bypass-redis
    volumes:
      - cloudflare-bypass-redis:/data
    restart: unless-stopped

volumes:
  cloudflare-bypass-redis:
